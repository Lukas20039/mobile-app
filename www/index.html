<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover is required so env(safe-area-inset-*) reports real values under
         the edge-to-edge display that Android 15+ enforces for targetSdk >= 35. -->
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width, viewport-fit=cover">
    <title>Grisu NÖ</title>

    <!-- disables the auto detection and link creation of numbers in iOS -->
    <meta name="format-detection" content="telephone=no">

    <link href="css/ionic.app.min.css" rel="stylesheet">
    <link href="lib/leaflet/dist/leaflet.css" rel="stylesheet">
    <link href="lib/Leaflet.awesome-markers/dist/leaflet.awesome-markers.css" rel="stylesheet">
    <link href="lib/angular-chart.js/dist/angular-chart.css" rel="stylesheet">

    <script src="lib/ionic/js/ionic.min.js"></script>
    <script src="lib/angular/angular.min.js"></script>
    <script src="lib/angular-animate/angular-animate.min.js"></script>
    <script src="lib/angular-sanitize/angular-sanitize.min.js"></script>
    <script src="lib/angular-ui-router/release/angular-ui-router.min.js"></script>
    <script src="lib/ionic/js/ionic-angular.min.js"></script>

    <script src="lib/Chart.js/Chart.min.js"></script>
    <script src="lib/angular-chart.js/dist/angular-chart.min.js"></script>
    <script src="lib/moment/min/moment.min.js"></script>
    <script src="lib/ng-cordova/dist/ng-cordova.min.js"></script>
    <script src="lib/leaflet/dist/leaflet.js"></script>
    <script src="lib/angular-leaflet-directive/dist/angular-leaflet-directive.min.js"></script>
    <script src="lib/Leaflet.awesome-markers/dist/leaflet.awesome-markers.min.js"></script>
    <script src="lib/x2js/xml2json.min.js"></script>
    <script src="lib/angular-xml/angular-xml.min.js"></script>
    <script src="lib/angular-md5/angular-md5.min.js"></script>
    <script src="cordova.js"></script>

    <script src="js/services/cordovaHttp.js"></script>
    <script src="js/app.js"></script>
    <!-- must load after app.js: decorates the 'grisu-noe' module -->
    <script src="js/services/nativeHttpBackend.js"></script>
    <script src="js/factories/dataService.js"></script>
    <script src="js/factories/geoService.js"></script>
    <script src="js/factories/storageService.js"></script>
    <script src="js/factories/screenshotService.js"></script>
    <script src="js/services/util.js"></script>
    <script src="js/controllers/overviewTabController.js"></script>
    <script src="js/controllers/districtsTabController.js"></script>
    <script src="js/controllers/incidentController.js"></script>
    <script src="js/controllers/extendedIncidentController.js"></script>
    <script src="js/controllers/incidentsListController.js"></script>
    <script src="js/controllers/waterTabController.js"></script>
    <script src="js/controllers/statisticsTabController.js"></script>
    <script src="js/controllers/historyController.js"></script>
</head>
<body>

<ion-nav-bar class="bar-red">
    <ion-nav-back-button class="button-white">
    </ion-nav-back-button>
</ion-nav-bar>

<ion-nav-view></ion-nav-view>

<script>
    var bootstrap = function() {
        angular.bootstrap(document, ['grisu-noe']);
    };

    // js/services/cordovaHttp.js registers the 'cordovaHTTP' module for both cases,
    // so the browser no longer needs a separate mock.
    if (window.cordova) {
        document.addEventListener('deviceready', function() {
            bootstrap();
        }, false);
    } else {
        bootstrap();
    }
</script>

</body>
</html>
